name: Reusable Binary Validation

on:
  workflow_call:
    inputs:
      version:
        description: "Version/tag to stamp into published binaries (e.g. v1.2.3)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      GIT_NO_LAZY_FETCH: 1
      GIT_TERMINAL_PROMPT: 0
      GCM_INTERACTIVE: Never
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-latest
            rid: linux-x64
          - name: Windows x64
            runner: windows-latest
            rid: win-x64
          - name: macOS Intel
            runner: macos-15-intel
            rid: osx-x64
          - name: macOS Apple Silicon
            runner: macos-15
            rid: osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true
          submodules: false
          lfs: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Force authenticated GitHub git URLs
        run: |
          git config --global --unset-all url."https://github.com/".insteadOf || true
          git config --global url."https://x-access-token:${{ github.token }}@github.com/".insteadOf "https://github.com/"
        shell: bash

      - name: Publish target binary
        run: |
          VERSION="${{ inputs.version }}"
          if [[ -z "${VERSION}" ]]; then
            VERSION="0.0.0-dev"
          fi
          VERSION="${VERSION#v}"

          dotnet publish PioneerConverter.csproj -c Release \
            -r "${{ matrix.rid }}" \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -p:EnableSourceControlManagerQueries=false \
            -p:Version="${VERSION}" \
            --self-contained true \
            -o "dist/${{ matrix.rid }}"
        shell: bash

      - name: Mark binary executable
        if: runner.os != 'Windows'
        run: chmod +x "dist/${{ matrix.rid }}/PioneerConverter"
        shell: bash

      - name: Verify binary version (Unix)
        if: runner.os != 'Windows'
        run: |
          EXPECTED_VERSION="${{ inputs.version }}"
          if [[ -z "${EXPECTED_VERSION}" ]]; then
            EXPECTED_VERSION="0.0.0-dev"
          fi
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"

          VERSION_OUTPUT="$(dist/${{ matrix.rid }}/PioneerConverter --version)"
          ACTUAL_VERSION="$(printf "%s" "${VERSION_OUTPUT}" | awk '{print $2}')"
          if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
            echo "Version mismatch: expected ${EXPECTED_VERSION}, got ${ACTUAL_VERSION}" >&2
            exit 1
          fi
        shell: bash

      - name: Verify binary version (Windows)
        if: runner.os == 'Windows'
        run: |
          $expectedVersion = "${{ inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($expectedVersion)) {
            $expectedVersion = "0.0.0-dev"
          }
          $expectedVersion = $expectedVersion.TrimStart('v')

          $versionOutput = & "dist/${{ matrix.rid }}/PioneerConverter.exe" --version
          if ($LASTEXITCODE -ne 0) {
            throw "Version check command failed with exit code $LASTEXITCODE"
          }

          $actualVersion = ($versionOutput -split '\s+')[-1]
          if ($actualVersion -ne $expectedVersion) {
            throw "Version mismatch: expected $expectedVersion, got $actualVersion"
          }
        shell: pwsh

      - name: Smoke test binary (Unix)
        if: runner.os != 'Windows'
        run: ./ci/smoke_test.sh "dist/${{ matrix.rid }}" "tests/fixtures/raw/smoke.raw"
        shell: bash

      - name: Smoke test binary (Windows)
        if: runner.os == 'Windows'
        run: ./ci/smoke_test.ps1 -PublishDir "dist/${{ matrix.rid }}" -FixturePath "tests/fixtures/raw/smoke.raw"
        shell: pwsh
